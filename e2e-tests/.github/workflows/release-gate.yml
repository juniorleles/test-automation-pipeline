name: Release Gate — Validação Completa

# Roda apenas ao criar uma tag de release
on:
  push:
    tags:
      - "v*.*.*"        # v1.0.0, v2.3.1, etc
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do release (ex: v1.2.0)"
        required: true

env:
  NODE_VERSION: "20"

jobs:

  # ── Validação completa antes do release ─────────────
  full-regression:
    name: "🔄 Regressão Completa"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        browser: [chromium, firefox]  # Testa em dois browsers
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependências E2E
        working-directory: e2e-tests
        run: npm install

      - name: Instalar ${{ matrix.browser }}
        working-directory: e2e-tests
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: "▶ Regressão completa — ${{ matrix.browser }}"
        working-directory: e2e-tests
        run: npx cucumber-js
        env:
          HEADLESS: true
          BROWSER: ${{ matrix.browser }}
        continue-on-error: true

      - name: Upload relatório — ${{ matrix.browser }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.browser }}-${{ github.ref_name }}
          path: e2e-tests/reports/
          retention-days: 90

  # ── Gate de qualidade ────────────────────────────────
  quality-gate:
    name: "🚦 Quality Gate"
    runs-on: ubuntu-latest
    needs: full-regression
    if: always()

    steps:
      - name: Verificar aprovação para release
        run: |
          REGRESSION="${{ needs.full-regression.result }}"
          echo "Regressão: $REGRESSION"

          if [ "$REGRESSION" = "success" ]; then
            echo "✅ Quality Gate aprovado — release pode prosseguir"
          else
            echo "❌ Quality Gate reprovado — release BLOQUEADO"
            echo "Corrija os testes com falha antes de liberar."
            exit 1
          fi

      - name: Criar Release Notes
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ github.ref_name }}' || '${{ github.event.inputs.version }}';
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: `## ✅ Validado pelo CI/CD Pipeline\n\n**Testes executados:**\n- ✅ Testes de API (63 testes)\n- ✅ Testes E2E — Login + Checkout (24 cenários)\n- ✅ Regressão completa em Chromium e Firefox\n\n**Aprovado para produção em:** ${new Date().toLocaleString('pt-BR', {timeZone: 'America/Sao_Paulo'})} BRT`,
              draft: false,
              prerelease: false
            });
