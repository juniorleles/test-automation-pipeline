name: CI/CD Pipeline — API + E2E + Mobile

# ─────────────────────────────────────────────────────────────
# GATILHOS
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    # Roda todos os dias às 06:00 UTC (03:00 BRT) — smoke test noturno
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Permite execução manual com parâmetros
    inputs:
      test_suite:
        description: "Qual suite rodar?"
        required: true
        default: "all"
        type: choice
        options: [all, api, e2e, mobile]
      environment:
        description: "Ambiente alvo"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

# ─────────────────────────────────────────────────────────────
# VARIÁVEIS GLOBAIS
# ─────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

# ─────────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────────
jobs:

  # ══════════════════════════════════════════════════════════
  # JOB 1 — VALIDAÇÃO INICIAL (roda primeiro, bloqueia o resto)
  # ══════════════════════════════════════════════════════════
  validate:
    name: "🔍 Validação e Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verificar estrutura de arquivos
        run: |
          echo "=== Estrutura do projeto ==="
          find . -name "*.feature" | head -20
          find . -name "*.spec.js" | head -20
          echo "=== Verificação concluída ==="

      - name: Validar sintaxe dos arquivos de configuração
        run: |
          node -e "require('./api-tests/playwright.config.js')" 2>/dev/null && echo "✅ API config OK" || echo "⚠ API config não encontrado"
          node -e "require('./e2e-tests/cucumber.js')" 2>/dev/null && echo "✅ E2E config OK" || echo "⚠ E2E config não encontrado"

  # ══════════════════════════════════════════════════════════
  # JOB 2 — TESTES DE API
  # ══════════════════════════════════════════════════════════
  api-tests:
    name: "🔌 Testes de API"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    # Roda se: suite = all ou api, ou se é push/PR
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'api'  ||
      github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache de dependências
        uses: actions/cache@v4
        with:
          path: api-tests/node_modules
          key: api-deps-${{ hashFiles('api-tests/package-lock.json') }}
          restore-keys: api-deps-

      - name: Instalar dependências
        working-directory: api-tests
        run: npm install

      - name: Instalar Playwright (API — sem browser)
        working-directory: api-tests
        run: npx playwright install --with-deps

      - name: Criar diretório de relatórios
        run: mkdir -p api-tests/reports

      - name: "▶ Rodar testes de API"
        working-directory: api-tests
        run: npm run test:list
        continue-on-error: true

      - name: Gerar relatório HTML
        if: always()
        working-directory: api-tests
        run: npx playwright test --reporter=html
        continue-on-error: true

      - name: Upload relatório de API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report-${{ github.run_number }}
          path: |
            api-tests/reports/
            api-tests/playwright-report/
          retention-days: 30

      - name: Publicar resultado no PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const conclusion = '${{ job.status }}';
            const icon = conclusion === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${icon} Testes de API — ${{ github.run_number }}\n**Status:** ${conclusion}\n**Branch:** ${{ github.ref_name }}\n**Commit:** ${{ github.sha }}\n\n> Relatório disponível nos artifacts da execução.`
            });

  # ══════════════════════════════════════════════════════════
  # JOB 3 — TESTES E2E
  # ══════════════════════════════════════════════════════════
  e2e-tests:
    name: "🌐 Testes E2E (Cucumber + Playwright)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'e2e'  ||
      github.event_name != 'workflow_dispatch'

    strategy:
      # Roda login e checkout em paralelo
      matrix:
        suite: [login, checkout]
      fail-fast: false  # Continua mesmo se uma suite falhar

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache de dependências
        uses: actions/cache@v4
        with:
          path: e2e-tests/node_modules
          key: e2e-deps-${{ hashFiles('e2e-tests/package-lock.json') }}
          restore-keys: e2e-deps-

      - name: Instalar dependências
        working-directory: e2e-tests
        run: npm install

      - name: Instalar Playwright browsers
        working-directory: e2e-tests
        run: npx playwright install chromium --with-deps

      - name: Criar diretórios de relatório
        run: |
          mkdir -p e2e-tests/reports/screenshots

      - name: "▶ Rodar suite — ${{ matrix.suite }}"
        working-directory: e2e-tests
        run: npx cucumber-js --profile ${{ matrix.suite }}
        env:
          HEADLESS: true
        continue-on-error: true

      - name: Gerar relatório HTML
        if: always()
        working-directory: e2e-tests
        run: node scripts/generate-report.js
        continue-on-error: true

      - name: Upload relatório E2E — ${{ matrix.suite }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.suite }}-${{ github.run_number }}
          path: |
            e2e-tests/reports/
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # JOB 4 — TESTES MOBILE (Appium + Android Emulator)
  # ══════════════════════════════════════════════════════════
  mobile-tests:
    name: "📱 Testes Mobile (Appium)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    if: |
      github.event.inputs.test_suite == 'all'    ||
      github.event.inputs.test_suite == 'mobile' ||
      github.event_name == 'schedule'            ||
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar Java (Appium requer JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Instalar Android SDK e Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          # Appium roda dentro deste contexto
          script: |
            echo "✅ Emulador Android iniciado"
            adb devices
            # Aguardar emulador estar completamente pronto
            adb wait-for-device
            adb shell input keyevent 82

      - name: Instalar Appium Server
        run: |
          npm install -g appium@2.x
          appium driver install uiautomator2
          appium driver list --installed

      - name: Iniciar Appium Server em background
        run: |
          appium --port 4723 --log appium.log &
          sleep 5
          echo "✅ Appium rodando na porta 4723"

      - name: Instalar dependências dos testes mobile
        working-directory: mobile-tests
        run: npm install

      - name: "▶ Rodar testes mobile"
        working-directory: mobile-tests
        run: npm test
        env:
          APPIUM_HOST: localhost
          APPIUM_PORT: 4723
          PLATFORM: android
          APP_PACKAGE: com.saucelabs.mydemoapp.android
        continue-on-error: true

      - name: Upload logs do Appium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-logs-${{ github.run_number }}
          path: |
            appium.log
            mobile-tests/reports/
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # JOB 5 — RELATÓRIO CONSOLIDADO
  # ══════════════════════════════════════════════════════════
  consolidated-report:
    name: "📊 Relatório Consolidado"
    runs-on: ubuntu-latest
    needs: [api-tests, e2e-tests, mobile-tests]
    if: always()  # Roda mesmo se jobs anteriores falharem

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Baixar todos os artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: "*-${{ github.run_number }}"

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Gerar relatório consolidado
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const apiStatus    = '${{ needs.api-tests.result }}';
          const e2eStatus    = '${{ needs.e2e-tests.result }}';
          const mobileStatus = '${{ needs.mobile-tests.result }}';

          const icon = s => s === 'success' ? '✅' : s === 'skipped' ? '⏭' : '❌';
          const now  = new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });

          const report = \`# 📊 Relatório CI/CD — Execução #${{ github.run_number }}

          ## Informações da Execução
          | Campo | Valor |
          |-------|-------|
          | **Repositório** | ${{ github.repository }} |
          | **Branch** | ${{ github.ref_name }} |
          | **Commit** | \\\`${{ github.sha }}\\\` |
          | **Autor** | ${{ github.actor }} |
          | **Gatilho** | ${{ github.event_name }} |
          | **Data/Hora** | \${now} (BRT) |
          | **Run ID** | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          ## Resultado por Suite

          | Suite | Status | Detalhes |
          |-------|--------|----------|
          | \${icon(apiStatus)} **Testes de API** | \${apiStatus} | JSONPlaceholder — 63 testes |
          | \${icon(e2eStatus)} **Testes E2E** | \${e2eStatus} | Login + Checkout — 24 cenários |
          | \${icon(mobileStatus)} **Testes Mobile** | \${mobileStatus} | Android — Appium |

          ## Status Geral
          \${[apiStatus, e2eStatus, mobileStatus].every(s => s === 'success' || s === 'skipped')
            ? '### ✅ PIPELINE PASSOU — Todos os testes executados com sucesso'
            : '### ❌ PIPELINE FALHOU — Verificar relatórios individuais nos artifacts'}

          ## Artifacts Disponíveis
          - \`api-test-report-${{ github.run_number }}\` — Relatório HTML dos testes de API
          - \`e2e-report-login-${{ github.run_number }}\` — Relatório E2E suite Login
          - \`e2e-report-checkout-${{ github.run_number }}\` — Relatório E2E suite Checkout
          - \`appium-logs-${{ github.run_number }}\` — Logs do Appium + relatório mobile
          \`;

          fs.mkdirSync('consolidated', { recursive: true });
          fs.writeFileSync('consolidated/REPORT.md', report);
          console.log(report);
          "

      - name: Upload relatório consolidado
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-report-${{ github.run_number }}
          path: consolidated/
          retention-days: 90

      - name: Comentar no PR com relatório final
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('consolidated/REPORT.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Falhar pipeline se algum teste crítico falhou
        if: |
          needs.api-tests.result == 'failure' ||
          needs.e2e-tests.result == 'failure'
        run: |
          echo "❌ Testes críticos falharam. Bloqueando merge."
          exit 1
