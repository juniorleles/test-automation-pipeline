name: Smoke Tests — PR Rápido

# Roda apenas testes @smoke em PRs para feedback rápido (< 3 min)
on:
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"

jobs:
  smoke-api:
    name: "💨 Smoke — API"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependências
        working-directory: api-tests
        run: npm install

      - name: Instalar Playwright
        working-directory: api-tests
        run: npx playwright install --with-deps

      - name: "▶ Smoke — GET /posts e GET /users"
        working-directory: api-tests
        run: npx playwright test tests/get.spec.js --reporter=list
        continue-on-error: true

  smoke-e2e:
    name: "💨 Smoke — E2E Login"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependências
        working-directory: e2e-tests
        run: npm install

      - name: Instalar Playwright browsers
        working-directory: e2e-tests
        run: npx playwright install chromium --with-deps

      - name: "▶ Smoke — Login válido"
        working-directory: e2e-tests
        run: npx cucumber-js --tags @smoke
        env:
          HEADLESS: true
        continue-on-error: true

  smoke-summary:
    name: "📋 Resumo Smoke"
    runs-on: ubuntu-latest
    needs: [smoke-api, smoke-e2e]
    if: always()

    steps:
      - name: Resultado dos smoke tests
        uses: actions/github-script@v7
        with:
          script: |
            const api  = '${{ needs.smoke-api.result }}';
            const e2e  = '${{ needs.smoke-e2e.result }}';
            const ok   = s => s === 'success' || s === 'skipped';
            const icon = s => ok(s) ? '✅' : '❌';

            const body = `## 💨 Smoke Tests — PR #${{ github.event.number }}

            | Suite | Status |
            |-------|--------|
            | ${icon(api)} API | ${api} |
            | ${icon(e2e)} E2E | ${e2e} |

            ${ok(api) && ok(e2e)
              ? '✅ **Smoke passou** — PR pode ser revisado com segurança.'
              : '❌ **Smoke falhou** — Verifique os logs antes de fazer merge.'}

            > Pipeline completo rodará após o merge.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
