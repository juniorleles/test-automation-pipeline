name: CI/CD Pipeline — API + E2E + Mobile

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Qual suite rodar?"
        required: true
        default: "all"
        type: choice
        options: [all, api, e2e, mobile]
      environment:
        description: "Ambiente alvo"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

jobs:

  # ══════════════════════════════════════════════════════════
  # JOB 1 — VALIDAÇÃO INICIAL
  # ══════════════════════════════════════════════════════════
  validate:
    name: "🔍 Validação e Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verificar estrutura de arquivos
        run: |
          echo "=== Estrutura do projeto ==="
          find . -name "*.feature" | head -20
          find . -name "*.spec.js" | head -20
          echo "=== Verificação concluída ==="

  # ══════════════════════════════════════════════════════════
  # JOB 2 — TESTES DE API
  # Testes de API fazem apenas requisições HTTP — SEM browser
  # Removido: playwright install (economiza ~8 min)
  # ══════════════════════════════════════════════════════════
  api-tests:
    name: "🔌 Testes de API"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'api'  ||
      github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache de dependências
        uses: actions/cache@v4
        with:
          path: api-tests/node_modules
          key: api-deps-${{ hashFiles('api-tests/package-lock.json') }}
          restore-keys: api-deps-

      - name: Instalar dependências
        working-directory: api-tests
        run: npm install

      # ✅ SEM playwright install — API usa apenas http do Node
      # O @playwright/test é usado só como test runner (assertions)
      # Não precisa de Chromium, Firefox ou WebKit

      - name: Criar diretório de relatórios
        run: mkdir -p api-tests/reports

      - name: "▶ Rodar testes de API"
        working-directory: api-tests
        run: npx playwright test --reporter=list
        continue-on-error: true

      - name: Gerar relatório JSON
        if: always()
        working-directory: api-tests
        run: npx playwright test --reporter=json 2>/dev/null || true
        continue-on-error: true

      - name: Upload relatório de API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report-${{ github.run_number }}
          path: api-tests/reports/
          retention-days: 30

      - name: Comentar resultado no PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const icon   = status === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${icon} Testes de API — Run #${{ github.run_number }}\n**Status:** ${status}\n**Branch:** ${{ github.ref_name }}\n\n> Relatório disponível nos artifacts da execução.`
            });

  # ══════════════════════════════════════════════════════════
  # JOB 3 — TESTES E2E
  # E2E precisa de browser — instala apenas Chromium
  # ══════════════════════════════════════════════════════════
  e2e-tests:
    name: "🌐 Testes E2E — ${{ matrix.suite }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    if: |
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'e2e'  ||
      github.event_name != 'workflow_dispatch'

    strategy:
      matrix:
        suite: [login, checkout]
      fail-fast: false

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache de dependências
        uses: actions/cache@v4
        with:
          path: e2e-tests/node_modules
          key: e2e-deps-${{ hashFiles('e2e-tests/package-lock.json') }}
          restore-keys: e2e-deps-

      - name: Instalar dependências
        working-directory: e2e-tests
        run: npm install

      # ✅ Apenas Chromium — reduz de ~8 min para ~2 min
      - name: Instalar Chromium
        working-directory: e2e-tests
        run: npx playwright install chromium --with-deps

      - name: Criar diretórios de relatório
        run: mkdir -p e2e-tests/reports/screenshots

      - name: "▶ Rodar suite — ${{ matrix.suite }}"
        working-directory: e2e-tests
        run: npx cucumber-js --profile ${{ matrix.suite }}
        env:
          HEADLESS: true
        continue-on-error: true

      - name: Gerar relatório HTML
        if: always()
        working-directory: e2e-tests
        run: node scripts/generate-report.js
        continue-on-error: true

      - name: Upload relatório E2E — ${{ matrix.suite }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.suite }}-${{ github.run_number }}
          path: e2e-tests/reports/
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # JOB 4 — TESTES MOBILE
  # NOTA: Emulador Android não é suportado de forma estável
  # no GitHub Actions (exit code 224 — falta de hardware
  # virtualization nos runners gratuitos).
  # Este job está desabilitado no pipeline automático.
  # Use o workflow separado mobile-tests.yml manualmente
  # ou em runners self-hosted com KVM habilitado.
  # ══════════════════════════════════════════════════════════
  mobile-tests:
    name: "📱 Testes Mobile (Appium)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate
    # ✅ Desabilitado: emulador Android requer KVM (não disponível
    # em runners gratuitos do GitHub). Usar workflow separado.
    if: false

    steps:
      - name: Mobile tests desabilitados no pipeline automático
        run: |
          echo "⚠️  Testes mobile requerem runner self-hosted com KVM."
          echo "Execute o workflow mobile-tests.yml manualmente."
          echo "Documentação: https://github.com/reactivecircus/android-emulator-runner"

  # ══════════════════════════════════════════════════════════
  # JOB 5 — RELATÓRIO CONSOLIDADO
  # ══════════════════════════════════════════════════════════
  consolidated-report:
    name: "📊 Relatório Consolidado"
    runs-on: ubuntu-latest
    needs: [api-tests, e2e-tests, mobile-tests]
    if: always()

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Baixar todos os artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: "*-${{ github.run_number }}"

      - name: Gerar relatório consolidado
        run: |
          node -e "
          const fs  = require('fs');
          const api    = '${{ needs.api-tests.result }}';
          const e2e    = '${{ needs.e2e-tests.result }}';
          const mobile = '${{ needs.mobile-tests.result }}';
          const icon   = s => s === 'success' ? '✅' : s === 'skipped' ? '⏭' : '❌';
          const now    = new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
          const ok     = [api, e2e, mobile].every(s => ['success','skipped'].includes(s));

          const report = \`# 📊 Relatório CI/CD — Run #${{ github.run_number }}

          | Campo | Valor |
          |-------|-------|
          | **Repositório** | ${{ github.repository }} |
          | **Branch** | ${{ github.ref_name }} |
          | **Commit** | \\\`${{ github.sha }}\\\` |
          | **Autor** | ${{ github.actor }} |
          | **Data/Hora** | \${now} BRT |

          ## Resultado por Suite
          | Suite | Status |
          |-------|--------|
          | \${icon(api)} Testes de API | \${api} |
          | \${icon(e2e)} Testes E2E | \${e2e} |
          | \${icon(mobile)} Testes Mobile | \${mobile} |

          \${ok ? '### ✅ PIPELINE PASSOU' : '### ❌ PIPELINE FALHOU — Verificar artifacts'}
          \`;

          fs.mkdirSync('consolidated', { recursive: true });
          fs.writeFileSync('consolidated/REPORT.md', report);
          console.log(report);
          "

      - name: Upload relatório consolidado
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-report-${{ github.run_number }}
          path: consolidated/
          retention-days: 90

      - name: Comentar relatório no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('consolidated/REPORT.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Bloquear merge se testes críticos falharam
        if: |
          needs.api-tests.result == 'failure' ||
          needs.e2e-tests.result == 'failure'
        run: |
          echo "❌ Testes críticos falharam. Bloqueando merge."
          exit 1
